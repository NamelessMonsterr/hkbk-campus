<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask HKBK - Evaluation</title>
<style>
:root { --fg:#1a1d24; --bg:#f6f4ef; --rule:#d8d2c4; --ok:#1e7a3c; --warn:#b8860b; --bad:#b3261e; }
* { box-sizing: border-box; }
body { font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 24px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 28px 0 8px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.sub { color: #666; font-size: 13px; margin-bottom: 16px; }
.banner { background: #fff4dc; border: 1px solid #d9a441; color: #5a3d0a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin: 12px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.card { background: #fff; border: 1px solid var(--rule); border-radius: 10px; padding: 12px; }
.card b { display: block; font-size: 24px; }
.card span { font-size: 12px; color: #666; }
table { border-collapse: collapse; width: 100%; background: #fff; font-size: 13px; margin: 8px 0; }
th, td { border: 1px solid var(--rule); padding: 6px 9px; text-align: left; }
th { background: #efece4; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
tr.fail { background: #fdf0ef; }
tr.clar { background: #f2f6ff; }
tr.shipped { background: #eef7ee; font-weight: 600; }
button, .btn { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); cursor: pointer; text-decoration: none; display: inline-block; }
button.ghost { background: transparent; color: var(--fg); }
.row { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
#status { font-size: 13px; color: #666; }
details { margin: 8px 0; }
summary { cursor: pointer; font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Ask HKBK - chatbot evaluation</h1>
<div class="sub">Runs a frozen question set through the live engine, in your browser, and scores every answer. Same harness as <code>node eval/run-eval.js</code>.</div>
<div id="banner" class="banner"></div>
<div class="row">
	<button id="run">Run evaluation</button>
	<button id="csv" class="ghost" disabled>Download CSV</button>
	<span id="status"></span>
</div>
<div id="out"></div>
<script src="../campus-explorer/js/chatbot-engine.js"></script>
<script src="../campus-explorer/data/knowledge-base.js"></script>
<script src="questions.js"></script>
<script src="eval-core.js"></script>
<script src="eval-page.js"></script>
</body>
</html>
