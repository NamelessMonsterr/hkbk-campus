<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>HKBK Campus Walk</title>
<link rel="stylesheet" href="lib/pannellum.css">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--serif:"Playfair Display","Libre Baskerville",Georgia,"Times New Roman",serif;--red:#d9453d}
html,body{margin:0;height:100%;background:#0b0b0c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
#stage{position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none}
#bg{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(34px) brightness(.45) saturate(1.15);transition:background-image .3s}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .26s ease,transform .3s cubic-bezier(.2,.7,.2,1);will-change:opacity,transform}
.layer.show{opacity:1}
#dip{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .15s}
#top{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));background:linear-gradient(#000b,#0000);pointer-events:none}
#top>*{pointer-events:auto}
#back{font-size:12px;letter-spacing:.04em;color:#ffffffcc;background:none;border:0;cursor:pointer;padding:6px 0}
#back:hover{color:#fff}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right;min-width:0}
#sname{font-family:var(--serif);font-size:20px;line-height:1.15;text-shadow:0 1px 6px #000}
#ssub{font-size:11.5px;opacity:.7;letter-spacing:.03em}
#btns{display:flex;gap:8px;margin-top:8px}
.rbtn{background:#1a1b1eb8;backdrop-filter:blur(8px);border:1px solid #ffffff22;color:#fff;border-radius:16px;height:28px;padding:0 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.rbtn:hover{background:#2c2e33d0}
#b360{display:none}
.side{position:absolute;top:50%;margin-top:-22px;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff66;background:#0008;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:background .2s,border-color .2s}
.side:hover{background:#000c;border-color:#fff}
#pl{left:14px}#pr{right:14px}
.side.off{opacity:.25;pointer-events:none}
.chev{position:absolute;left:50%;z-index:6;cursor:pointer;transform-origin:50% 100%;filter:drop-shadow(0 2px 5px #0009);transition:opacity .2s,filter .2s;opacity:.8}
.chev svg{width:100%;height:100%;display:block}
.chev:hover{opacity:1;filter:drop-shadow(0 0 10px #fff9)}
#cf{bottom:17%;width:130px;height:95px;margin-left:-65px;transform:perspective(520px) rotateX(62deg)}
.chev.off{display:none}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:9;background:#1a1b1ed8;backdrop-filter:blur(8px);padding:7px 14px;border-radius:16px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#cap{position:absolute;left:18px;bottom:44px;z-index:8;font-size:11px;opacity:.7;letter-spacing:.03em;text-shadow:0 1px 3px #000;pointer-events:none;max-width:60%}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:0 18px;padding-bottom:max(12px,env(safe-area-inset-bottom));pointer-events:none;background:linear-gradient(#0000,#000a)}
#track{position:relative;height:22px;margin-right:140px;pointer-events:auto;cursor:pointer}
#track:before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:#ffffff40}
#fill{position:absolute;left:0;top:10px;height:2px;background:var(--red)}
.tick{position:absolute;top:6px;width:2px;height:10px;margin-left:-1px;background:#fff9;cursor:pointer}
.tick:hover{background:#fff;height:14px;top:4px}
.tick.on{background:var(--red)}
#mm{position:absolute;right:16px;bottom:max(14px,env(safe-area-inset-bottom));z-index:12;width:112px;height:112px;border-radius:50%;overflow:hidden;border:2px solid #fffd;box-shadow:0 3px 14px #000a;background:#222;cursor:default}
#mmbox{position:absolute;aspect-ratio:1400/1500;left:0;top:0;transform-origin:0 0;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
#mmbox img{width:100%;height:100%;display:block;-webkit-user-drag:none}
#mmbox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#ea4335;border:1.5px solid #fff;pointer-events:none}
.mk.nofoot{background:#888}
#me{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px #1a73e855;pointer-events:none;transition:left .3s,top .3s;z-index:3}
#mmtag{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:9px;background:#000a;padding:1px 7px;border-radius:8px;z-index:4;pointer-events:none}
#p360{position:absolute;inset:0;z-index:20;background:#000;display:none}
#p360 #pv{position:absolute;inset:0}
#p360 .rbtn{position:absolute;top:14px;right:14px;z-index:3}
#loading{position:absolute;inset:0;z-index:30;background:#0b0b0c;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.1em;opacity:1;transition:opacity .4s;color:#aaa}
#intro{position:absolute;inset:0;z-index:25;background:radial-gradient(ellipse at 50% 30%,#1a1b1f,#0b0b0c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#intro .eb{font-size:11px;letter-spacing:.22em;color:#ffffff80;text-transform:uppercase;margin-bottom:22px}
#intro h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,6vw,60px);line-height:1.18;margin:0 0 22px;max-width:760px}
#intro p{max-width:520px;font-size:14px;line-height:1.65;color:#ffffffa8;margin:0 0 28px}
#intro label{font-size:10px;letter-spacing:.2em;color:#ffffff70;text-transform:uppercase;margin-bottom:8px}
#chap{background:#0b0b0c;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:10px 14px;font-size:14px;min-width:260px;margin-bottom:18px}
#go{background:var(--red);color:#fff;border:0;border-radius:24px;padding:13px 34px;font-size:14px;cursor:pointer}
#go:hover{filter:brightness(1.1)}
#intro small{margin-top:22px;font-size:11px;color:#ffffff60;max-width:480px;line-height:1.6}
@media(max-width:700px){#sname{font-size:16px}#cf{width:100px;height:74px;margin-left:-50px}#mm{width:92px;height:92px}#track{margin-right:108px}#cap{bottom:40px;max-width:55%;font-size:10px}.side{width:38px;height:38px;margin-top:-19px;font-size:17px}#pl{left:8px}#pr{right:8px}#top{padding:10px 12px}}
</style></head><body>
<div id="stage"><div id="bg"></div><img class="layer" id="l0" alt=""><img class="layer" id="l1" alt=""><div id="dip"></div></div>
<div id="top"><button id="back">&larr; Intro</button>
<div id="right"><div id="sname"></div><div id="ssub"></div><div id="btns"><button class="rbtn" id="play">Walk</button><button class="rbtn" id="restart">Restart</button><button class="rbtn" id="b360">360&deg;</button></div></div></div>
<button class="side" id="pl" aria-label="Previous">&larr;</button><button class="side" id="pr" aria-label="Next">&rarr;</button>
<div class="chev" id="cf"><svg viewBox="0 0 150 110"><path d="M12 92 L75 22 L138 92 L112 92 L75 51 L38 92 Z" fill="#fff" stroke="#0004" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div id="toast"></div><div id="cap"></div>
<div id="bar"><div id="track"><div id="fill"></div></div></div>
<div id="mm"><div id="mmbox"><img src="assets/campus_map.jpg" alt="map"><svg id="route" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="me"></div></div><div id="mmtag">MAP</div></div>
<div id="p360"><div id="pv"></div><button class="rbtn" id="x360">Close 360&deg;</button></div>
<div id="intro"><div class="eb">HKBK &middot; Campus &middot; Real footage</div><h1>A walk through the HKBK campus</h1>
<p>Step through the campus one frame at a time, in route order, from the gate to the hostels. Every image is a real still from campus video, not a 3D model. Each clip change is a hard cut.</p>
<label for="chap">Choose a chapter</label><select id="chap"></select><button id="go">Start walk</button>
<small id="note"></small></div>
<div id="loading">LOADING</div>
<script src="lib/pannellum.js"></script>
<script src="walk-data.js"></script>
<script>
(function(){
var W=window.WALK,ST=W.steps,N=ST.length,stops=W.stops,BINS=W.bins.map(function(u){return{url:u,p:null,buf:null}});
var cur=0,L=[document.getElementById('l0'),document.getElementById('l1')],top=0,playing=false,timer=null,started=false;
function $(i){return document.getElementById(i)}
function loadBin(b){if(b>=BINS.length)return Promise.resolve();var B=BINS[b];if(!B.p)B.p=fetch(B.url).then(function(r){return r.arrayBuffer()}).then(function(x){B.buf=x;return x});return B.p}
function ensure(i){i=Math.max(0,Math.min(N-1,i));var s=ST[i];if(s.u)return Promise.resolve(s.u);return loadBin(s.b).then(function(buf){return s.u=s.u||URL.createObjectURL(new Blob([buf.slice(s.o,s.o+s.l)],{type:'image/jpeg'}))})}
function pre(i){for(var k=1;k<=5;k++)if(i+k<N)ensure(i+k);if(i+1<N)loadBin(ST[Math.min(N-1,i+8)].b)}
var anch=stops.filter(function(s){return s.step!=null}).sort(function(a,b){return a.step-b.step});
function posAt(i){if(!anch.length)return{x:50,y:50};if(i<=anch[0].step)return{x:anch[0].mx,y:anch[0].my};
for(var k=0;k<anch.length-1;k++){var a=anch[k],b=anch[k+1];if(i<=b.step){var t=(i-a.step)/Math.max(1,b.step-a.step);return{x:a.mx+(b.mx-a.mx)*t,y:a.my+(b.my-a.my)*t}}}
var l=anch[anch.length-1];return{x:l.mx,y:l.my}}
function chapterOf(i){var s=null;anch.forEach(function(a){if(a.step<=i)s=a});return s||anch[0]}
function setStep(i,dir,instant){
  i=Math.max(0,Math.min(N-1,i));if(i===cur&&!instant)return;
  var cut=(dir>0&&ST[i].cut)||(dir<0&&ST[cur].cut);
  var nxt=1-top,a=L[nxt],b=L[top];
  var go=function(){ensure(i).then(function(u){
    a.style.transition='none';a.style.transform='scale('+(dir>=0?0.95:1.05)+')';a.classList.remove('show');
    a.onload=function(){requestAnimationFrame(function(){requestAnimationFrame(function(){
      a.style.transition='';a.classList.add('show');a.style.transform='scale(1)';
      b.classList.remove('show');b.style.transform='scale('+(dir>=0?1.04:0.96)+')';top=nxt;$('bg').style.backgroundImage='url('+u+')';
      $('dip').style.opacity='0'})})};
    a.src=u;cur=i;ui();pre(i)})};
  if(instant){go();return}
  if(cut){$('dip').style.opacity='1';toast('Clip change - hard cut');setTimeout(go,150)}else go();
}
var tt=null;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1500)}
function ui(){
  var s=chapterOf(cur),atStop=s&&Math.abs(s.step-cur)<=1;
  $('sname').textContent=s?s.name:'';
  $('ssub').textContent='Step '+(cur+1)+' of '+N;
  $('cap').textContent='Source: '+ST[cur].c.replace('_',' ')+' \u00b7 sampled still '+(ST[cur].t+1)+(ST[cur].cut?' \u00b7 discontinuous from previous frame':'');
  $('fill').style.width=(cur/(N-1)*100)+'%';
  $('cf').classList.toggle('off',cur>=N-1);$('pr').classList.toggle('off',cur>=N-1);$('pl').classList.toggle('off',cur<=0);
  document.querySelectorAll('.tick').forEach(function(e){e.classList.toggle('on',s&&e.dataset.id===s.id)});
  var p=posAt(cur);$('me').style.left=p.x+'%';$('me').style.top=p.y+'%';recenter(p);
  var b=$('b360');b.style.display=(atStop&&s.pano)?'inline-block':'none';
  if(started)history.replaceState(null,'','#'+(cur+1));
}
function endOfWalk(){stop();toast('End of walk - tap Walk to replay')}
function fwd(){if(cur<N-1)setStep(cur+1,1);else endOfWalk()}
function back(){if(cur>0)setStep(cur-1,-1)}
var STRIDE=3;
function tapF(){if(cur<N-1)setStep(Math.min(cur+STRIDE,N-1),1);else endOfWalk()}
function tapB(){if(cur>0)setStep(Math.max(cur-STRIDE,0),-1)}
$('cf').onclick=function(e){e.stopPropagation();tapF()};$('pr').onclick=tapF;$('pl').onclick=tapB;
document.addEventListener('keydown',function(e){
  if($('p360').style.display==='block'){if(e.key==='Escape')close360();return}
  if(!started)return;
  if(e.key==='ArrowUp'||e.key==='ArrowRight'||e.key===' '||e.key==='w'){e.preventDefault();tapF()}
  if(e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='s'){e.preventDefault();tapB()}});
var wl=0;$('stage').addEventListener('wheel',function(e){e.preventDefault();var n=Date.now();if(n-wl<180)return;wl=n;if(e.deltaY<0)tapF();else tapB()},{passive:false});
var sx=0,sy=0;$('stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY});
$('stage').addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<30&&Math.abs(dy)<30)return;if(Math.abs(dy)>Math.abs(dx)){if(dy<0)tapF();else tapB()}else{if(dx<0)tapF();else tapB()}});
function play(){playing=true;$('play').textContent='Pause';timer=setInterval(fwd,900)}
function stop(){playing=false;$('play').textContent='Walk';clearInterval(timer)}
$('play').onclick=function(){playing?stop():play()};
$('restart').onclick=function(){stop();setStep(0,-1)};
var tr=$('track');
stops.forEach(function(s){if(s.step==null)return;var t=document.createElement('div');t.className='tick';t.dataset.id=s.id;t.style.left=(s.step/(N-1)*100)+'%';t.title=s.n+'. '+s.name;
  t.onclick=function(e){e.stopPropagation();stop();setStep(s.step,s.step>=cur?1:-1)};tr.appendChild(t)});
tr.onclick=function(e){var r=tr.getBoundingClientRect();stop();var i=Math.round((e.clientX-r.left)/r.width*(N-1));setStep(i,i>=cur?1:-1)};
var mm=$('mm'),box=$('mmbox');
stops.forEach(function(s){var m=document.createElement('div');m.className='mk'+(s.step==null?' nofoot':'');m.style.left=s.mx+'%';m.style.top=s.my+'%';box.appendChild(m)});
$('route').innerHTML='<polyline points="'+stops.map(function(s){return s.mx+','+s.my}).join(' ')+'" fill="none" stroke="#ffd54a" stroke-width="2" stroke-dasharray="4,3" vector-effect="non-scaling-stroke"/>';
function recenter(p){var w=mm.clientWidth,h=mm.clientHeight,bw=w*3.2,bh=bw*1500/1400;box.style.width=bw+'px';box.style.transform='translate('+(w/2-p.x/100*bw)+'px,'+(h/2-p.y/100*bh)+'px)'}
window.addEventListener('resize',function(){recenter(posAt(cur))});
var pv=null;
$('b360').onclick=function(){var s=chapterOf(cur);if(!s||!s.pano)return;$('p360').style.display='block';if(pv)pv.destroy();pv=pannellum.viewer('pv',{type:'equirectangular',panorama:s.pano,autoLoad:true,northOffset:s.northOffset||0,compass:true})};
function close360(){$('p360').style.display='none';if(pv){pv.destroy();pv=null}}
$('x360').onclick=close360;
// intro
var chap=$('chap');anch.forEach(function(s){var o=document.createElement('option');o.value=s.step;o.textContent=s.n+'. '+s.name;chap.appendChild(o)});
var miss=stops.filter(function(s){return s.step==null}).map(function(s){return s.name});
$('note').textContent=miss.length?miss.join(', ')+': no footage yet.':'';
function begin(i){started=true;$('intro').style.display='none';ensure(i).then(function(u){L[0].onload=function(){L[0].classList.add('show');$('bg').style.backgroundImage='url('+u+')'};L[0].src=u;cur=i;top=0;ui();pre(i)})}
$('go').onclick=function(){begin(parseInt(chap.value,10)||0)};
$('back').onclick=function(){stop();started=false;$('intro').style.display='flex'};
var q=new URLSearchParams(location.search),h=parseInt(location.hash.slice(1),10);
var s0=3;if(h>0&&h<=N)s0=h-1;var st=parseInt(q.get('start'),10);if(st>0&&st<=N)s0=st-1;
if(q.get('stop')){var ss=stops.filter(function(s){return s.id===q.get('stop')})[0];if(ss&&ss.step!=null)s0=ss.step}
loadBin(ST[0].b).then(function(){$('loading').style.opacity='0';setTimeout(function(){$('loading').style.display='none'},400);
  if(!q.get('intro')){chap.value=s0;begin(s0)}
  if(q.get('play'))play()});
recenter(posAt(0));
})();
</script></body></html>
